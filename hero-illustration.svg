<svg viewBox="0 0 480 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroIllustrationTitle">
  <title id="heroIllustrationTitle">Illustration of a smartphone at the centre of connected digital and government services</title>

  <!-- Orbit rings (decorative) -->
  <circle cx="240" cy="240" r="188" stroke="#0F62FE" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="2 8" />
  <circle cx="240" cy="240" r="150" stroke="#16A34A" stroke-opacity="0.10" stroke-width="1.5" />

  <!-- Connector lines from phone to orbiting tiles -->
  <g stroke="#0F62FE" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="4 6">
    <line x1="240" y1="240" x2="106" y2="130" class="parallax-layer" data-depth="0.15" />
    <line x1="240" y1="240" x2="378" y2="112" class="parallax-layer" data-depth="0.15" />
    <line x1="240" y1="240" x2="88" y2="330" class="parallax-layer" data-depth="0.15" />
    <line x1="240" y1="240" x2="392" y2="340" class="parallax-layer" data-depth="0.15" />
  </g>

  <!-- Service tile: Document (top-left) -->
  <g class="parallax-layer" data-depth="0.45" transform="translate(66,88)">
    <rect x="0" y="0" width="80" height="88" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="16" y="20" width="48" height="6" rx="3" fill="#0F62FE" fill-opacity="0.7" />
    <rect x="16" y="34" width="36" height="5" rx="2.5" fill="#CBD5E1" />
    <rect x="16" y="46" width="42" height="5" rx="2.5" fill="#CBD5E1" />
    <rect x="16" y="62" width="28" height="14" rx="7" fill="#E3F6EA" />
    <rect x="20" y="66.5" width="20" height="5" rx="2.5" fill="#16A34A" />
  </g>

  <!-- Service tile: Payment / recharge (top-right) -->
  <g class="parallax-layer" data-depth="0.3" transform="translate(340,72)">
    <rect x="0" y="0" width="76" height="76" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="38" cy="38" r="20" fill="#FEF3DE" />
    <path d="M32 38h12M38 32v12" stroke="#C97F08" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Service tile: ID / secure check (bottom-left) -->
  <g class="parallax-layer" data-depth="0.35" transform="translate(48,300)">
    <rect x="0" y="0" width="72" height="72" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <path d="M36 14l20 8v16c0 15-8.5 24-20 30-11.5-6-20-15-20-30V22l20-8z" fill="#E7EFFE" stroke="#0F62FE" stroke-width="1.5" transform="translate(0,3)" />
    <path d="M28 39l6 6 12-13" stroke="#0F62FE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,3)" />
  </g>

  <!-- Service tile: Cloud connectivity (bottom-right) -->
  <g class="parallax-layer" data-depth="0.4" transform="translate(354,318)">
    <rect x="0" y="0" width="78" height="78" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <path d="M23 46a10 10 0 0 1 2-19.8 13 13 0 0 1 25 3.6A9 9 0 0 1 49 46H23z" fill="#E3F6EA" stroke="#16A34A" stroke-width="1.5" />
  </g>

  <!-- Central smartphone -->
  <g class="parallax-layer" data-depth="0.08">
    <rect x="176" y="140" width="128" height="204" rx="26" fill="#111827" />
    <rect x="184" y="156" width="112" height="168" rx="4" fill="#F8FAFC" />
    <rect x="222" y="146" width="36" height="5" rx="2.5" fill="#1F2937" />

    <!-- Screen content: service grid -->
    <rect x="196" y="172" width="88" height="20" rx="6" fill="#0F62FE" />
    <rect x="204" y="180" width="40" height="5" rx="2.5" fill="#F8FAFC" fill-opacity="0.85" />

    <rect x="196" y="202" width="40" height="40" rx="10" fill="#E7EFFE" />
    <rect x="244" y="202" width="40" height="40" rx="10" fill="#E3F6EA" />
    <rect x="196" y="250" width="40" height="40" rx="10" fill="#FEF3DE" />
    <rect x="244" y="250" width="40" height="40" rx="10" fill="#E7EFFE" />

    <rect x="196" y="298" width="88" height="12" rx="6" fill="#E2E8F0" />

    <!-- Home indicator -->
    <rect x="222" y="332" width="36" height="4" rx="2" fill="#334155" />
  </g>

  <!-- Small orbiting dots for ambient motion -->
  <circle class="parallax-layer" data-depth="0.55" cx="152" cy="200" r="4" fill="#0F62FE" />
  <circle class="parallax-layer" data-depth="0.6" cx="330" cy="180" r="3.5" fill="#16A34A" />
  <circle class="parallax-layer" data-depth="0.5" cx="322" cy="292" r="3" fill="#F59E0B" />
</svg>
